packages:
  - core
  - worker

# Hoisted rather than pnpm's default isolated layout, and set here rather than
# passed to the image build, so local and image installs are identical.
#
# The image needs it: the final stage copies node_modules to a different path,
# and the isolated layout's symlinks into node_modules/.pnpm do not survive
# that move. Setting it only in the Dockerfile would work, but it reintroduces
# the gap where a dependency resolves locally and not in the container.
nodeLinker: hoisted

catalog:
  '@mikro-orm/core': ^7.1.11
  '@mikro-orm/decorators': ^7.1.11
  '@mikro-orm/migrations': ^7.1.11
  '@mikro-orm/postgresql': ^7.1.11
  '@mikro-orm/sql-highlighter': ^1.0.1
  '@types/node': ^24.10.1
  nats: ^2.29.3
  typescript: ^7.0.2
