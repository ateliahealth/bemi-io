# Keeps the SHA pins in publish-context.yml current. A pin nobody updates stops
# receiving fixes and eventually breaks at publish time.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One PR rather than three; an update nobody reads is how pins go stale.
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
    labels: ['dependencies']
