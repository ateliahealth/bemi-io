# Part of a fork of Bemi (https://github.com/BemiHQ/bemi-io),
# modified by Atelia Health, 2026. Licensed under SSPL-1.0; see LICENSE.
#
# Publishes context/ to npm. That package is MIT and independent of the rest of
# this repository, which is SSPL-1.0 - see context/LICENSE.
name: Publish pg-change-context

on:
  push:
    # Separate from `bemi-v*`, which selects what the deployment pipeline
    # builds. The two version independently.
    tags: ['pg-change-context-v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    # GitHub-hosted, not Blacksmith: npm refuses a provenance bundle built on a
    # self-hosted runner. Auth and signing both succeed there, so it fails at
    # the registry with E422 after the transparency log entry is already
    # written. This job is seconds long; the speed is not worth it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # This is the credential, not just provenance: npm exchanges it for
      # publish rights.
      id-token: write
    steps:
      # SHA-pinned like the other workflows; .github/dependabot.yml keeps them
      # current. Highest stakes here: this job can publish under our name.
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # npm versions are immutable, so a mismatch cannot be unpicked.
      - name: Tag must match the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#pg-change-context-v}"
          PKG_VERSION="$(node -p "require('./context/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME implies $TAG_VERSION, package.json says $PKG_VERSION" >&2
            exit 1
          fi
          echo "Publishing @atelia/pg-change-context@$PKG_VERSION"

      - name: Run typescript
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Run oxlint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      # Most important check here: this is the one failure that ends up on a
      # public registry under the wrong licence.
      - name: Check the MIT/SSPL boundary
        run: ./scripts/licence-boundary.sh

      - name: Build
        run: pnpm --filter @atelia/pg-change-context run build

      # `files` is easy to break and the damage only shows on someone's install.
      - name: Verify the tarball contents
        working-directory: context
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          FILES="$(node -p "require('/tmp/pack.json')[0].files.map(f => f.path).join('\n')")"
          echo "$FILES"
          for required in LICENSE README.md dist/index.js dist/index.d.ts; do
            echo "$FILES" | grep -qxF "$required" || { echo "missing from tarball: $required" >&2; exit 1; }
          done
          echo "$FILES" | grep -qE '^src/' && { echo "source leaked into the tarball" >&2; exit 1; }
          exit 0

      # Checked, not upgraded: `npm i -g npm@latest` would run an unpinned
      # package in the job that can publish under our name.
      - name: npm must support trusted publishing
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm $NPM_VERSION"
          MAJOR="${NPM_VERSION%%.*}"
          if [ "$MAJOR" -lt 11 ]; then
            echo "npm $NPM_VERSION cannot authenticate via OIDC; needs 11.5.1 or newer" >&2
            exit 1
          fi

      - name: Publish
        working-directory: context
        # No token by design: npm prefers one when present, so a configured
        # secret would silently keep using the credential this replaces.
        # Rights come from the trusted publisher naming this repo and this
        # filename - renaming the file revokes them. access and provenance are
        # in publishConfig so a local publish behaves the same.
        run: npm publish
