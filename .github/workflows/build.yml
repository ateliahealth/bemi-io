name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Secrets, not vars: this repo is public and vars are unmasked in job logs.
env:
  TURBO_API: ${{ secrets.TURBO_API }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  test-core:
    name: Test core
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # The licence check needs a merge-base against upstream.
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typescript
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Run oxlint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      # SSPL-1.0 5(a): files this fork diverges from upstream on must say so.
      - name: Check the MIT/SSPL boundary
        run: ./scripts/licence-boundary.sh

      - name: Check licence notices
        run: |
          git remote add upstream https://github.com/BemiHQ/bemi-io.git
          git fetch --quiet --no-tags upstream main
          UPSTREAM_REF=upstream/main pnpm run license:check
