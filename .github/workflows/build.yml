name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-core:
    name: Test core
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - uses: pnpm/action-setup@v4
      name: Install pnpm
      with:
        version: 10.32.1
        run_install: false

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run typescript
      run: pnpm run typecheck

    - name: Run tests
      run: pnpm run test

    - name: Run oxlint
      run: pnpm run lint

    - name: Check formatting
      run: pnpm --filter @bemi-db/core run format:check

  build-local:
    name: Build local docker image
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Build worker image
      run: docker build -f worker/Dockerfile -t bemi-worker:local .
