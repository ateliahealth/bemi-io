name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Secrets, not vars: this repo is public and vars are unmasked in job logs.
env:
  TURBO_API: ${{ secrets.TURBO_API }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  test-core:
    name: Test core
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # The licence check needs a merge-base against upstream.
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typescript
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Run oxlint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      # SSPL-1.0 5(a): files this fork diverges from upstream on must say so.
      - name: Check licence notices
        run: |
          git remote add upstream https://github.com/BemiHQ/bemi-io.git
          git fetch --quiet --no-tags upstream main
          UPSTREAM_REF=upstream/main pnpm run license:check

  # Stands the whole pipeline up and asserts the properties that unit tests
  # cannot reach: that a write survives the worker being down, that the
  # replication slot holds under back-pressure instead of advancing past
  # unconsumed changes, and that a replay lands each row exactly once.
  compose-gate:
    name: Compose regression gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Stand up the pipeline
        run: ./scripts/compose-gate.sh setup

      - name: Changes propagate with before/after images
        run: ./scripts/compose-gate.sh baseline

      - name: Writes during worker downtime still land
        run: ./scripts/compose-gate.sh downtime

      - name: Control - a slot reset really does lose them
        run: ./scripts/compose-gate.sh negative-control

      - name: Back-pressure holds the replication slot
        run: ./scripts/compose-gate.sh backpressure

      - name: Raising the cap replays every row exactly once
        run: ./scripts/compose-gate.sh recovery

      - name: Each service recovers from a kill
        run: ./scripts/compose-gate.sh kill-restart

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 200
