quarkus.log.level=INFO
quarkus.log.console.json=false
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=BEMI_SLOT_NAME
debezium.source.snapshot.mode=never
# Must match UNAVAILABLE_VALUE_PLACEHOLDER in core/src/fetched-record.ts, which
# strips it. Otherwise an unchanged TOASTed column (>2KB) is recorded with the
# literal placeholder string as its value.
debezium.source.unavailable.value.placeholder=__bemi_unavailable_value
debezium.source.database.hostname=DB_HOST
debezium.source.database.port=DB_PORT
debezium.source.database.dbname=DB_NAME
debezium.source.database.user=DB_USER
debezium.source.database.password=DB_PASSWORD
debezium.source.table.exclude.list=public.changes
debezium.source.offset.storage.file.filename=offsets.dat
debezium.source.topic.prefix=bemi
debezium.source.key.converter.schemas.enable=false
debezium.source.value.converter.schemas.enable=false
debezium.transforms=Reroute
debezium.transforms.Reroute.type=io.debezium.transforms.ByLogicalTableRouter
debezium.transforms.Reroute.topic.regex=bemi\..*
debezium.transforms.Reroute.topic.replacement=bemi
debezium.sink.type=nats-jetstream
debezium.sink.nats-jetstream.url=NATS_URL
debezium.sink.nats-jetstream.subjects=bemi,__debezium-heartbeat.*
# Stream is pre-created with bounded File storage + Limits retention in reset.ts (see worker/src/reset.ts).
# Leaving this true makes Debezium recreate it with the unbounded in-memory default, which OOM-kills the pod.
debezium.sink.nats-jetstream.create-stream=false
